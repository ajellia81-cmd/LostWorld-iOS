# Builds LostWorld.ipa on a GitHub macOS runner (platform/ios/build.sh), for
# LiveContainer. Run it from the Actions tab (Run workflow).
#
# This repository holds only source code and may be public. The ROM and the
# built app stay in a PRIVATE repository (PRIVATE_REPO below): the ROM in its
# release tagged "rom", each new LostWorld.ipa in its release tagged
# "latest". The secret PRIVATE_REPO_TOKEN is a fine-grained token with
# Contents: read and write on that repository only. Nothing built is
# uploaded here: a public repository's artifacts can be downloaded by anyone,
# and LICENSE forbids sharing builds and the ROM.
#
# "check" builds the app against stand-in code instead (no ROM needed): it
# only tells whether the port compiles and links for iOS.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ipa: the game (needs the ROM release) / check: compile check without the ROM"
        type: choice
        options: [ipa, check]
        default: ipa

permissions:
  contents: read

env:
  PRIVATE_REPO: ajellia81-cmd/LostWorld-iOS-private

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          command -v ninja >/dev/null || brew install ninja
          cmake --version | head -1
          xcodebuild -version

      - name: ROM (private repository, release "rom")
        if: inputs.mode == 'ipa'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::The secret PRIVATE_REPO_TOKEN is missing."; exit 1; fi
          if ! gh release download rom -R "$PRIVATE_REPO" --pattern lostwsga.zip --dir . ; then
            echo "::error::No lostwsga.zip in the release tagged 'rom' of the private repository (or the token cannot read it)."
            exit 1
          fi
          ls -l lostwsga.zip

      - name: Stand-in code (check)
        if: inputs.mode == 'check'
        run: python3 platform/ios/stub_gen.py

      - name: MoltenVK and the build tools (cache)
        uses: actions/cache@v4
        with:
          path: |
            third_party/downloads
            build/ios-host
          key: ios-tools-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'third_party/deps.txt', 'platform/ios/build.sh') }}

      - name: Build
        env:
          LW_SKIP_RECOMP: ${{ inputs.mode == 'check' && '1' || '' }}
          LW_NO_ROM_IN_APP: ${{ inputs.mode == 'check' && '1' || '' }}
        run: bash platform/ios/build.sh lostwsga.zip

      - name: LostWorld.ipa (private repository, release "latest")
        if: inputs.mode == 'ipa'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          gh release view latest -R "$PRIVATE_REPO" >/dev/null 2>&1 ||
            gh release create latest -R "$PRIVATE_REPO" --title "LostWorld.ipa" --notes "The latest build (replaced by each run)."
          gh release upload latest out/ios/LostWorld.ipa -R "$PRIVATE_REPO" --clobber
          gh release edit latest -R "$PRIVATE_REPO" --notes "Built from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})."
          echo "::notice::LostWorld.ipa uploaded to the private repository's release 'latest'"
        # never published here
      - name: Clean up
        if: always()
        run: rm -f lostwsga.zip out/ios/LostWorld.ipa
